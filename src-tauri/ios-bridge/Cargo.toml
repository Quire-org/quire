[package]
name = "quire-ios-bridge"
version = "0.1.0"
description = "What only iOS can do for Quire: opening a folder, and hearing the app leave the screen"
authors = ["Kile"]
edition = "2024"
rust-version = "1.89"
publish = false
links = "quire-ios-bridge"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
