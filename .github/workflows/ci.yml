# Tests on every push and pull request: the frontend (types and unit tests), the backend (lints and
# unit tests on all three platforms) and the dependency advisories. The engine has its own workflow
# (engine.yml), run when it changes: its build is long.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/tags -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # tauri-build checks that the frontend's build folder and the engine sidecar exist; the tests
      # need neither's content, so an empty folder and the empty stand-in do.
      - run: mkdir -p dist && node scripts/sidecar.mjs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: Tag index and learning
        run: cargo test
        working-directory: src-tauri/tags
      - name: The vault's cipher
        run: cargo test -p quire-crypto
        working-directory: src-tauri

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        working-directory: src-tauri
      - run: cargo audit
        working-directory: engine
